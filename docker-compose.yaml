version: '3.8'

services:
  simulateur_convoyeur:
    build:
      context: .
      dockerfile: ./machine-simulator/dockerfile
    image: machine-simulator
    environment:
      MACHINE_ID: convoyeur-1
      MACHINE_TYPE: convoyeur
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}

  simulateur_presse:
    build:
      context: .
      dockerfile: ./machine-simulator/dockerfile
    image: machine-simulator
    environment:
      MACHINE_ID: presse-1
      MACHINE_TYPE: presse
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}

  simulateur_imprimante:
    build:
      context: .
      dockerfile: ./machine-simulator/dockerfile
    image: machine-simulator
    environment:
      MACHINE_ID: imprimante-1
      MACHINE_TYPE: imprimante
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}

  simulateur_compresseur:
    build:
      context: .
      dockerfile: ./machine-simulator/dockerfile
    image: machine-simulator
    environment:
      MACHINE_ID: compresseur-1
      MACHINE_TYPE: compresseur
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}